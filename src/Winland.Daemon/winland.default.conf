# Winland wrote this file on first start, because %USERPROFILE%\.winland\winland.conf
# was missing and no --config was given. Edit it and save: Winland reads it again.
#
# Alt+Tab, Win+L, Win+E, Win+Space and Win+Shift+S stay with Windows:
# switching windows, locking the screen, File Explorer, the input language,
# and the snipping tool.

# Programs launched below.
# wt is Windows Terminal. explorer is File Explorer. notepad is Notepad.
# exec runs through cmd. start opens an https address, and Windows hands that
# address to the user's default browser.
$terminal = wt
$browser = start https://
$fileManager = explorer
$editor = notepad

# Close the focused Client. Win+W opens Widgets and Win+Q opens Search.
bind = SUPER, W, killactive
bind = SUPER, Q, killactive

# Swap the split direction. Win+J focuses a Windows tip when one is showing.
# A split keeps the direction it was given only with preserve_split on.
dwindle:preserve_split = true
bind = SUPER, J, togglesplit

# Show the focused Client at its own size, centered in its tile. Win+P is Project.
bind = SUPER, P, pseudo

# Float or tile the focused Client. Win+T cycles the apps on the taskbar.
bind = SUPER, T, togglefloating

# Full screen. Win+F opens Feedback Hub.
bind = SUPER, F, fullscreen

# Maximize, which is fullscreen mode 1.
bind = SUPER ALT, F, fullscreen, 1

# Float and pin. Both run, float first: a tile becomes a pinned float, and
# pressing again tiles it. A tile cannot stay pinned. Win+O locks rotation.
bind = SUPER, O, togglefloating
bind = SUPER, O, pin

# The next Layout, and the previous one. Win+K opens Cast.
# Win+Alt+K mutes the microphone.
bind = SUPER, K, cyclelayout
bind = SUPER ALT, K, cyclelayout, back

# Focus the Client in that direction. Win+Arrows snap a window.
bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Down, movefocus, d

# The cursor hides on a key press, so it does not show where moving focus puts
# it, and comes back when the mouse moves.
cursor:hide_on_key_press = true

# Swap with the Client in that direction.
# Win+Shift+Left and Win+Shift+Right move a window to another monitor.
bind = SUPER SHIFT, Left, swapwindow, l
bind = SUPER SHIFT, Right, swapwindow, r
bind = SUPER SHIFT, Up, swapwindow, u
bind = SUPER SHIFT, Down, swapwindow, d

# Move the focused Client to the Monitor in that direction.
bind = SUPER SHIFT CTRL, Left, movewindow, mon:l
bind = SUPER SHIFT CTRL, Right, movewindow, mon:r
bind = SUPER SHIFT CTRL, Up, movewindow, mon:u
bind = SUPER SHIFT CTRL, Down, movewindow, mon:d

# Move this Monitor's Workspace to the Monitor in that direction.
bind = SUPER SHIFT ALT, Left, movecurrentworkspacetomonitor, l
bind = SUPER SHIFT ALT, Right, movecurrentworkspacetomonitor, r
bind = SUPER SHIFT ALT, Up, movecurrentworkspacetomonitor, u
bind = SUPER SHIFT ALT, Down, movecurrentworkspacetomonitor, d

# Workspaces 1 to 10 of this Monitor. The 0 key is Workspace 10.
# Win+1 through Win+0 open the apps pinned on the taskbar.
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move the focused Client to that Workspace and follow it.
# Win+Shift+1 through Win+Shift+0 open a new window of a pinned app.
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Move the focused Client there and stay on this Workspace.
bind = SUPER SHIFT ALT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT ALT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT ALT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT ALT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT ALT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT ALT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT ALT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT ALT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT ALT, 9, movetoworkspacesilent, 9
bind = SUPER SHIFT ALT, 0, movetoworkspacesilent, 10

# Show or hide the Special workspace named scratchpad.
# Win+S opens Search.
bind = SUPER, S, togglespecialworkspace, scratchpad
bind = SUPER, grave, togglespecialworkspace, scratchpad

# Move the focused Client onto that Special workspace and stay here.
bind = SUPER ALT, S, movetoworkspacesilent, special:scratchpad
bind = SUPER SHIFT, grave, movetoworkspacesilent, special:scratchpad

# The next and previous Workspace on this Monitor. Win+Tab opens Task view.
bind = SUPER, Tab, workspace, m+1
bind = SUPER SHIFT, Tab, workspace, m-1

# The Workspace this Monitor showed before this one.
bind = SUPER CTRL, Tab, workspace, previous_per_monitor

# The next and previous Monitor.
# Ctrl+Alt+Tab opens the window switcher and leaves it open.
bind = CTRL ALT, Tab, focusmonitor, +1
bind = CTRL ALT SHIFT, Tab, focusmonitor, -1

# Resize the focused Client by 100 pixels.
# Win+- and Win+= zoom Magnifier out and in.
bind = SUPER, minus, resizeactive, -100 0
bind = SUPER, equal, resizeactive, 100 0
bind = SUPER SHIFT, minus, resizeactive, 0 -100
bind = SUPER SHIFT, equal, resizeactive, 0 100

# The same resize, by 25 pixels with Alt and by 300 with Ctrl.
bind = SUPER ALT, minus, resizeactive, -25 0
bind = SUPER ALT, equal, resizeactive, 25 0
bind = SUPER CTRL, minus, resizeactive, -300 0
bind = SUPER CTRL, equal, resizeactive, 300 0
bind = SUPER SHIFT ALT, minus, resizeactive, 0 -25
bind = SUPER SHIFT ALT, equal, resizeactive, 0 25
bind = SUPER SHIFT CTRL, minus, resizeactive, 0 -300
bind = SUPER SHIFT CTRL, equal, resizeactive, 0 300

# The wheel moves to the next or previous Workspace on this Monitor.
bind = SUPER, mouse_down, workspace, m+1
bind = SUPER, mouse_up, workspace, m-1

# Win and the left button drag a Client. Win and the right button resize it.
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Put the focused Client in a Group, or take the Group apart. Win+G opens Game Bar.
bind = SUPER, G, togglegroup

# Take the focused Client out of its Group.
bind = SUPER ALT, G, moveoutofgroup

# Join the Group in that direction.
bind = SUPER ALT, Left, moveintogroup, l
bind = SUPER ALT, Right, moveintogroup, r
bind = SUPER ALT, Up, moveintogroup, u
bind = SUPER ALT, Down, moveintogroup, d

# The next and previous member of the Group.
bind = SUPER ALT, Tab, changegroupactive, f
bind = SUPER ALT SHIFT, Tab, changegroupactive, b

# The same on the arrow keys.
# Win+Ctrl+Left and Win+Ctrl+Right switch Windows desktops.
bind = SUPER CTRL, Left, changegroupactive, b
bind = SUPER CTRL, Right, changegroupactive, f

# And on the wheel.
bind = SUPER ALT, mouse_down, changegroupactive, f
bind = SUPER ALT, mouse_up, changegroupactive, b

# Show member 1 through 5.
# Win+Alt+1 through Win+Alt+5 open the jump list of a pinned app.
bind = SUPER ALT, 1, changegroupactive, 1
bind = SUPER ALT, 2, changegroupactive, 2
bind = SUPER ALT, 3, changegroupactive, 3
bind = SUPER ALT, 4, changegroupactive, 4
bind = SUPER ALT, 5, changegroupactive, 5

# Ask every Client to close.
bind = SUPER CTRL ALT, W, closeall

# Copy, paste, cut and select all: the focused window receives Ctrl+C, Ctrl+V,
# Ctrl+X and Ctrl+A. Win+C opens Copilot, Win+V opens clipboard history,
# Win+X opens the Quick Link menu and Win+A opens Quick Settings.
bind = SUPER, C, sendshortcut, CTRL, C
bind = SUPER, V, sendshortcut, CTRL, V
bind = SUPER, X, sendshortcut, CTRL, X
bind = SUPER, A, sendshortcut, CTRL, A

# What Win+V, Win+X and Win+A used to open: clipboard history, the Quick Link
# menu and Quick Settings. They move to Win+Ctrl+V, Win+Ctrl+X and Win+Ctrl+A.
bind = SUPER CTRL, V, sendshortcut, SUPER, V
bind = SUPER CTRL, X, sendshortcut, SUPER, X
bind = SUPER CTRL, A, sendshortcut, SUPER, A

# Launch a program. Win+Enter starts Narrator.
bind = SUPER, Return, exec, $terminal
bind = SUPER SHIFT, Return, exec, $browser
bind = SUPER SHIFT, B, exec, $browser
bind = SUPER SHIFT, F, exec, $fileManager
bind = SUPER SHIFT, N, exec, $editor

# Three fingers sideways switch Workspace on this Monitor.
# Windows also sees the swipe. In Settings, under Bluetooth & devices, then
# Touchpad, set three-finger swipes to Nothing.
gesture = 3, horizontal, workspace

# Windows open, close and move into place in 300 ms. Without this line they
# take 800 ms, and the last few pixels crawl in for most of that time.
animation = windows, 1, 3, default

# A window Winland closes goes at once, and the windows beside it move into
# its space without waiting for it to shrink and fade out.
animation = windowsOut, 0
animation = fadeOut, 0
