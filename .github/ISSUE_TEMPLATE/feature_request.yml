name: Feature request
description: A behavior Winland should have
title: "feat: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: wanted
    attributes:
      label: What should happen
      description: The behavior you want, and how someone can see that it works.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: What is out of scope
    validations:
      required: false
