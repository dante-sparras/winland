name: Bug
description: Something in this repo is broken
labels: [needs-triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The lines that show it. Leave out secrets.
    validations:
      required: false
