name: Bug report
description: Report broken behavior, regressions, crashes, or reliability issues.
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for broken behavior, regressions, crashes, or reliability problems.
        For a new feature or an improvement, use the Feature request form instead.
        Search existing issues first and keep the report focused on one problem.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Tiling and layouts
        - Workspaces and monitors
        - Hotkeys and dispatchers
        - Config
        - CLI
        - Install and update
        - Build, CI, or release tooling
        - Docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, deterministic repro.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How bad is this in practice?
      options:
        - Blocks work completely
        - Major degradation or frequent failure
        - Minor bug or occasional failure
        - Cosmetic issue
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Paste the output of winland version. For a local build, also include its commit SHA.
      placeholder: "winland version output"

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, runtime and tool versions, and anything else relevant.

  - type: textarea
    id: configerrors
    attributes:
      label: Config errors
      description: Paste the output of winland configerrors while Winland is running.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack traces
      description: >-
        The default elevated install writes no log file. For a crash, open Event Viewer > Windows Logs > Application
        and copy the .NET Runtime event 1026 for Winland, including its time, exception and stack trace.
        An unelevated run such as winland install --user writes winland.log when debug:disable_logs = false.
        Attach that file and winland.log.1 if present. Redact secrets.
      render: shell

  - type: upload
    id: attachments
    attributes:
      label: Screenshots, recordings, or supporting files
      description: Upload screenshots, short recordings, repro archives, or log files. Redact secrets before uploading.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.svg,.mp4,.mov,.webm,.log,.txt,.json,.zip"

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a temporary workaround, include it.
