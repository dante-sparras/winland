# Called from ci.yml when a release run is dispatched. Not a pull-request entry point.
# The score gate is thresholds.break in stryker-config.json, applied to each lane's whole score.
# scripts/mutate.ps1 holds the lanes. Each run it lists (a lane, or one shard of a long lane) is a
# job of its own, so each fits its timeout on a 4-vCPU runner. The runs never fail on their score;
# the gate job adds up every lane's runs and fails when a lane is under the threshold. Any failed
# job fails the caller, so a release run fails if any run or the gate fails.
# With no unit-test project under tests/ yet, -List prints [] and the other jobs are skipped.

name: Mutation testing

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to test. Empty means the caller commit."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  runs:
    name: List the mutation runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      runs: ${{ steps.list.outputs.runs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: List the runs
        id: list
        shell: pwsh
        run: |
          $runs = ./scripts/mutate.ps1 -List
          if ($LASTEXITCODE -ne 0) { throw "mutate.ps1 -List failed with $LASTEXITCODE" }
          Write-Output "runs: $runs"
          "runs=$runs" >> $env:GITHUB_OUTPUT

  mutation:
    name: Mutation testing (${{ matrix.run }})
    needs: runs
    if: needs.runs.outputs.runs != '[]'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.runs.outputs.runs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore Stryker
        run: dotnet tool restore

      # Stryker's default is half the logical processors. A runner has nothing else to do.
      - name: Run Stryker
        shell: pwsh
        env:
          RUN: ${{ matrix.run }}
        run: ./scripts/mutate.ps1 -Run $env:RUN -Concurrency ([Environment]::ProcessorCount)

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.run }}
          path: |
            tests/*/StrykerOutput/${{ matrix.run }}/reports/mutation-report.html
            tests/*/StrykerOutput/${{ matrix.run }}/mutation-summary.json
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Mutation score gate
    needs: [runs, mutation]
    if: needs.runs.outputs.runs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-report-*
          path: ${{ runner.temp }}/mutation

      - name: Check each lane's score
        shell: pwsh
        env:
          REPORTS: ${{ runner.temp }}/mutation
        run: ./scripts/mutate.ps1 -Gate $env:REPORTS
