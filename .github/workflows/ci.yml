# Shared by Winoma, Winshell, and Winland. Keep the copies identical.
# One pull-request entry point. mutation.yml is workflow_call only.
# Branch protection requires only the job name "All required checks pass (v1)".
# When a required step or job is added, bump (v1) here and in
# .github/rulesets/protect-main.json in the same change. A green check on a
# commit stays green forever, so the new name is what makes an old green stop counting.
# Do not add secrets to this workflow. pull_request runs the file from the pull request.
#
# Every check is a step in one Windows job. A net10.0-windows project does not build on
# Ubuntu, and GitHub bills each job by the started minute, so small separate jobs cost more
# than the work they do. CI runs on pull requests, not on the push a merge makes to main.
# A release run tests the exact commit it ships.
# Mutation testing is the slow lane. It runs when CI is dispatched with release=true.

name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release run: also run mutation testing"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      ref:
        description: "Commit to test. Empty means the event's own commit."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The ruleset names this check and no other.
  check:
    name: All required checks pass (v1)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # fetch-depth 0 also fetches every branch, so origin/main and the pull request's base
      # are present without a second fetch, and no credential has to stay on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # A branch that shares no commit with main would add a second root commit to main
      # and break git blame.
      - name: Reject unrelated history
        shell: pwsh
        env:
          HEAD_SHA: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          git merge-base origin/main $env:HEAD_SHA | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::error::This branch has no common ancestor with main.'
            exit 1
          }
          exit 0
      - name: Run lint
        shell: pwsh
        run: ./scripts/check.ps1
      # actionlint is pinned by version and SHA-256. To upgrade, take both from the
      # release's actionlint_<version>_checksums.txt (windows_amd64 zip).
      - name: Lint the workflows
        shell: pwsh
        run: |
          $version = '1.7.12'
          $sha256 = '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9'
          $zipName = "actionlint_${version}_windows_amd64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $zipName
          $dir = Join-Path $env:RUNNER_TEMP 'actionlint'
          Invoke-WebRequest -Uri "https://github.com/rhysd/actionlint/releases/download/v$version/$zipName" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($actual -ne $sha256) {
            throw "$zipName has SHA-256 $actual, expected $sha256."
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $files = Get-ChildItem -Path .github/workflows -Filter *.yml | ForEach-Object { $_.FullName }
          & (Join-Path $dir 'actionlint.exe') @files
          if ($LASTEXITCODE -ne 0) {
            throw "actionlint reported problems (exit code $LASTEXITCODE)."
          }
      # Tests run unless the pull request only changes docs and repo metadata.
      # Any other changed file turns them on, so a new kind of file is tested by default.
      # An empty diff turns them off. --no-renames lists the old path of a rename too,
      # so moving a code file into docs/ still counts as a code change.
      # Manual and release runs fail open so a bad classification cannot weaken a release.
      - name: Classify the diff
        id: classify
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          if ($env:EVENT_NAME -ne 'pull_request') {
            "test=true" >> $env:GITHUB_OUTPUT
            Write-Output 'test lane: true (fail open)'
            exit 0
          }
          $files = @(git diff --name-only --no-renames "origin/$($env:BASE_REF)...$($env:HEAD_SHA)")
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with $LASTEXITCODE" }
          $docs = '^(.*\.md|docs/.*|\.github/ISSUE_TEMPLATE/.*|\.github/PULL_REQUEST_TEMPLATE\.md|\.github/CODEOWNERS|\.github/rulesets/.*|\.gitignore|\.gitattributes|LICENSE.*)$'
          $code = @($files | Where-Object { $_ -and $_ -cnotmatch $docs })
          $test = if ($code.Count -gt 0) { 'true' } else { 'false' }
          "test=$test" >> $env:GITHUB_OUTPUT
          Write-Output "test lane: $test"
      - name: Run tests
        if: steps.classify.outputs.test == 'true'
        shell: pwsh
        run: ./scripts/test.ps1

  # Runs beside the check, not after it, so a release run is no slower.
  # A failure fails the release run. Pull requests never run it.
  mutation:
    name: Mutation testing
    if: inputs.release == true
    uses: ./.github/workflows/mutation.yml
    with:
      ref: ${{ inputs.ref }}
