name: CI

on:
  push:
    # A commit that only changes documents builds nothing, so it is not a version.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:

# The build job reads the repository and nothing more. Only the release job below may write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # version.ps1 counts the commits on HEAD (ADR 0177).
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/Winland.Tests/Winland.Tests.csproj -c Release

      - name: Publish
        shell: pwsh
        run: ./publish.ps1 -Out publish

      - name: Check the publish
        shell: pwsh
        run: |
          if (Test-Path publish\Winland\winland.dll) { throw 'winland.exe in the publish is managed, not native' }
          $version = Get-Content publish\Winland\version.json -Raw | ConvertFrom-Json
          if ($version.commit -ne $env:GITHUB_SHA) { throw "version.json names $($version.commit), not $env:GITHUB_SHA" }

      - name: Pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          ./pack.ps1 -Out packages | Select-Object -Last 1 | Set-Content version.txt -NoNewline
          tar -a -c -f Winland-win-x64.zip --exclude=*.pdb -C publish\Winland .
          Copy-Item publish\Winland\version.json version.json

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: build-of-main
          path: |
            packages/*.nupkg
            Winland-win-x64.zip
            version.json
            version.txt
          retention-days: 1
          if-no-files-found: error

  release:
    # Each green build of main is a version: a release named v<version> with the zip, and the three packages.
    # Winshell and Winoma pin a version, and Winoma's install downloads that release's zip (ADR 0177).
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-of-main

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Push the packages
        run: |
          set -euo pipefail
          dotnet nuget push "packages/*.nupkg" --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" --api-key "$GH_TOKEN" --skip-duplicate

      - name: Release the build
        run: |
          set -euo pipefail
          version="$(cat version.txt)"
          gh release create "v$version" Winland-win-x64.zip version.json --target "$GITHUB_SHA" --title "Winland $version" --notes "Winland $version, built from $GITHUB_SHA."
