name: Release Please

on:
  push:
    branches:
      - main
  # Lets you re-run it, for example after adding the release token.
  workflow_dispatch:

permissions: {}

# Two quick merges queue up instead of racing to update the same release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # tags and GitHub releases
      issues: write # labels on the release PR
      pull-requests: write # opens and updates the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # PRs opened with GITHUB_TOKEN do not trigger CI, so required checks never run on the release
      # PR. RELEASE_PLEASE_TOKEN (a fine-grained PAT) fixes that; without it, close and reopen the
      # release PR to trigger its checks.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  ci:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      release: true
      ref: ${{ needs.release-please.outputs.tag_name }}

  # release-please makes the release a draft and creates its tag. After CI passes, this job builds the tagged commit,
  # uploads the files install.ps1 and winland update download, and only then publishes, so the newest
  # published release always has its zip.
  publish:
    name: Build and publish the release
    needs: [release-please, ci]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # uploads the assets and publishes the draft
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Publish, zip, and checksum
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Version $env:RELEASE_VERSION -Commit (git rev-parse HEAD).Trim() -OutputDirectory (Join-Path $env:RUNNER_TEMP 'package')
      - name: Upload the assets and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'package/dist'
          gh release upload $env:TAG (Join-Path $dist 'Winland-win-x64.zip') (Join-Path $dist 'version.json') (Join-Path $dist 'SHA256SUMS') --repo $env:REPO --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:TAG --repo $env:REPO --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
