name: Close stale "needs-info" issues

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # saves the run state between runs
      issues: write # comments on and closes issues
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-issue-labels: "needs-info"
          # A maintainer applies the label, so never auto-mark; close 7 days after it was added.
          # Any comment after the label removes it, so ask the question first, then add the label.
          days-before-issue-stale: -1
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-issue-stale-when-updated: true
          stale-issue-label: "needs-info"
          close-issue-reason: not_planned
          close-issue-message: >-
            Closing: no reply in 7 days after we asked for more information.
            Comment with the missing details and we will reopen.
          operations-per-run: 200
