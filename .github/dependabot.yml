# Dependabot opens one pull request a month for NuGet packages and the .NET SDK
# in global.json, and one a week for GitHub Actions. Minor and patch bumps of
# packages and actions are grouped. A major bump arrives as its own pull request.
# Actions are pinned to a full commit SHA.
# CVE-only security updates are a repository setting.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(actions)
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      include: scope
    labels: [dependencies]
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
      include: scope
    labels: [dependencies]
