# GitHub Actions only. Application dependencies move in a reviewed pull request,
# not on a schedule. Actions are pinned to a full commit SHA.
# CVE-only security updates are a repository setting.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(actions)
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
